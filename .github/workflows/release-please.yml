on:
  push:
    branches:
      - main

permissions:
  contents: read

name: release-please

jobs:
  release-please:
    if: github.repository == 'privy-io/unity-sdk'
    runs-on: ubuntu-latest
    environment: package-release
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Mint Builder Blobby token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUILDER_BLOBBY_APP_ID }}
          private-key: ${{ secrets.BUILDER_BLOBBY_APP_PRIVATE_KEY }}
          owner: privy-io
          repositories: unity-sdk
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ github.ref_name }}

  release-proposal:
    name: Post release proposal
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Augment the release PR with the release proposal: the exact source SHA and a
      # compare link from the last published tag. See RELEASING.md.
      - name: Check out release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/release

      # Runs the TypeScript release scripts (Node 24 runs .mts files directly).
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Build release proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release/proposal-comment.mts > "$RUNNER_TEMP/release-proposal.md"

      - name: Post release proposal to the release PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          number: ${{ fromJSON(needs.release-please.outputs.pr).number }}
          header: release-proposal
          path: ${{ runner.temp }}/release-proposal.md
